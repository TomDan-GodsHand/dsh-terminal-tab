# Typecheck, build, and run the plugin's smoke checks.
#
# Everything here is keyless and offline: the checks exercise the real modules
# with a fake PTY, a fake socket, and a fake host context, so no DSH instance,
# no API key, and no browser are involved. `--ignore-scripts` skips node-pty's
# native build, which CI does not need because nothing here spawns a terminal.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin's own floor, and the version it is developed against.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke checks
        run: npm test

      - name: Verify the build output exists
        run: |
          test -f lib/index.js
          test -f lib/client.js
